name: Deploy AI Studio Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./smit-tech-ai
        run: npm install --legacy-peer-deps

      - name: Build website
        working-directory: ./smit-tech-ai
        run: npm run build -- --base=/smit-tech-ai/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./smit-tech-ai/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
